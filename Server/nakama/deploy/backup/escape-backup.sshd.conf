Match User escape-backup
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    AuthorizedKeysFile /etc/escape-backup/reader-authorized-keys
    ForceCommand /usr/bin/python3 -I /usr/local/lib/escape-backup/backup.py export
Match all
